<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- ==========================================================
       Open Graph / Twitter card share image, 1200×630.
       Mirrors the brand lockup at preview-friendly proportions.
       ========================================================== -->

  <defs>
    <!-- Atmospheric gold wash (echoes the hero treatment) -->
    <radialGradient id="goldWash" cx="85%" cy="20%" r="65%">
      <stop offset="0%"  stop-color="#C9A84C" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </radialGradient>
    <!-- Subtle vignette to keep edges premium -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="80%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.32"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0B1628"/>
  <rect width="1200" height="630" fill="url(#goldWash)"/>
  <rect width="1200" height="630" fill="url(#vignette)"/>

  <!-- ==========================================================
       Constellation mark, centered horizontally
       Native viewBox is 55 45 150 150 (150 wide).
       Render at 200×200, x = (1200-200)/2 = 500, y = 60
       ========================================================== -->
  <svg x="500" y="60" width="200" height="200" viewBox="55 45 150 150" overflow="visible">
    <!-- Outer faint connecting lines -->
    <g stroke="#C9A84C" stroke-width="1" opacity="0.5" fill="none">
      <line x1="130" y1="73" x2="130" y2="53"/>
      <line x1="170" y1="96" x2="191" y2="87"/>
      <line x1="170" y1="144" x2="191" y2="153"/>
      <line x1="130" y1="166" x2="130" y2="187"/>
      <line x1="90"  y1="144" x2="69"  y2="153"/>
      <line x1="90"  y1="96"  x2="69"  y2="87"/>
    </g>
    <!-- Hex perimeter -->
    <g stroke="#C9A84C" stroke-width="1" opacity="0.4" fill="none">
      <line x1="130" y1="78"  x2="166" y2="99"/>
      <line x1="166" y1="99"  x2="166" y2="141"/>
      <line x1="166" y1="141" x2="130" y2="162"/>
      <line x1="130" y1="162" x2="94"  y2="141"/>
      <line x1="94"  y1="141" x2="94"  y2="99"/>
      <line x1="94"  y1="99"  x2="130" y2="78"/>
    </g>
    <!-- Inner spokes -->
    <g stroke="#C9A84C" stroke-width="1.5" opacity="0.9" fill="none">
      <line x1="130" y1="113" x2="130" y2="82"/>
      <line x1="134" y1="115" x2="162" y2="101"/>
      <line x1="134" y1="125" x2="162" y2="139"/>
      <line x1="130" y1="127" x2="130" y2="158"/>
      <line x1="126" y1="125" x2="98"  y2="139"/>
      <line x1="126" y1="115" x2="98"  y2="101"/>
    </g>
    <!-- Outer ring nodes -->
    <g fill="#C9A84C" opacity="0.5">
      <circle cx="130" cy="50"  r="3"/>
      <circle cx="194" cy="85"  r="3"/>
      <circle cx="194" cy="155" r="3"/>
      <circle cx="130" cy="190" r="3"/>
      <circle cx="66"  cy="155" r="3"/>
      <circle cx="66"  cy="85"  r="3"/>
    </g>
    <!-- Inner ring nodes -->
    <g fill="#C9A84C" opacity="0.95">
      <circle cx="130" cy="78"  r="4.5"/>
      <circle cx="166" cy="99"  r="4.5"/>
      <circle cx="166" cy="141" r="4.5"/>
      <circle cx="130" cy="162" r="4.5"/>
      <circle cx="94"  cy="141" r="4.5"/>
      <circle cx="94"  cy="99"  r="4.5"/>
    </g>
    <!-- Center node -->
    <circle cx="130" cy="120" r="7" fill="#C9A84C"/>
  </svg>

  <!-- ==========================================================
       Type stack, vertically centered horizontally
       ========================================================== -->

  <!-- Eyebrow: REINVENTING -->
  <text x="600" y="312"
        text-anchor="middle"
        font-family="'Montserrat', system-ui, sans-serif"
        font-size="22"
        font-weight="400"
        letter-spacing="7"
        fill="#C9A84C">REINVENTING</text>

  <!-- Wordmark: REAL ESTATE -->
  <text x="600" y="395"
        text-anchor="middle"
        font-family="'Cormorant Garamond', Georgia, serif"
        font-size="80"
        font-weight="300"
        letter-spacing="12"
        fill="#FFFFFF">REAL ESTATE</text>

  <!-- Gold hairline rule -->
  <line x1="450" y1="425" x2="750" y2="425"
        stroke="#C9A84C" stroke-width="1" opacity="0.65"/>

  <!-- Tagline with gold accent.
       Non-breaking spaces (&#xa0;) on either side of the gold span
       prevent some SVG renderers from collapsing whitespace at
       tspan boundaries. -->
  <text x="600" y="476"
        text-anchor="middle"
        font-family="'Cormorant Garamond', Georgia, serif"
        font-size="28"
        font-weight="300"
        font-style="italic"
        xml:space="preserve">
    <tspan fill="#FFFFFF" opacity="0.92">Big decisions deserve&#xa0;</tspan><tspan fill="#C9A84C">data-backed</tspan><tspan fill="#FFFFFF" opacity="0.92">&#xa0;confidence.</tspan>
  </text>

  <!-- Bottom byline -->
  <text x="600" y="565"
        text-anchor="middle"
        font-family="'Montserrat', system-ui, sans-serif"
        font-size="13"
        font-weight="400"
        letter-spacing="6"
        fill="#C9A84C"
        opacity="0.78">NORTH COUNTY · SAN DIEGO</text>
</svg>
